<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; }
body { font-family: "Poppins", sans-serif; background: #fefbf6; padding: 24px; -webkit-font-smoothing: antialiased; }
.row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
.lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #a89e93; width: 100%; }
button {
  font-family: "Poppins", sans-serif;
  font-weight: 700;
  background: #fefbf6;
  border: 2px solid #000;
  width: 200px; min-width: 204px; height: 50px;
  padding: 10px;
  cursor: pointer;
}
.hovered { font-style: italic; box-shadow: 0 20px 25px -5px rgb(0 0 0/.1), 0 8px 10px -6px rgb(0 0 0/.1); }
.success  { color: #10b981; border-color: #10b981; box-shadow: 0 20px 25px -5px rgb(0 0 0/.1), 0 8px 10px -6px rgb(0 0 0/.1); }
.disabled { opacity: 0.4; cursor: not-allowed; }
</style></head><body>
<div class="lbl">Default</div>
<div class="row">
  <button>Connect</button>
  <button>Update</button>
</div>
<div class="lbl">Hover State (italic + shadow)</div>
<div class="row">
  <button class="hovered">Connect</button>
  <button class="hovered">Update</button>
</div>
<div class="lbl">Success / Active</div>
<div class="row">
  <button class="success">Update</button>
</div>
<div class="lbl">Disabled (opacity 0.4)</div>
<div class="row">
  <button class="disabled" disabled>Connect</button>
  <button class="disabled" disabled>Update</button>
</div>
</body></html>
