<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; }
body { font-family: "Poppins", sans-serif; background: #fefbf6; padding: 24px; -webkit-font-smoothing: antialiased; }
.section { margin-bottom: 20px; }
.lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #a89e93; margin-bottom: 10px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

.tag { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; padding: 3px 8px; }
.tag-black  { background: #000; color: #fefbf6; }
.tag-cream  { background: #fefbf6; color: #000; border: 1px solid #000; }
.tag-red    { background: #ef4444; color: #fff; }
.tag-green  { background: #10b981; color: #fff; }

.banner { background: #000; color: #fefbf6; display: flex; align-items: center; gap: 12px; padding: 10px 20px; font-size: 13px; font-weight: 500; width: 100%; }
.success-msg { border: 2px solid #10b981; color: #10b981; font-weight: 700; font-size: 14px; padding: 10px 16px; background: #fefbf6; width: fit-content; }
.warning-box { border: 2px solid #000; color: #ef4444; font-weight: 600; padding: 16px; width: 300px; box-shadow: 0 20px 25px -5px rgb(0 0 0/.1); }
</style></head><body>

<div class="section">
  <div class="lbl">Tags</div>
  <div class="row">
    <span class="tag tag-black">Beta</span>
    <span class="tag tag-cream">Note</span>
    <span class="tag tag-red">Warning</span>
    <span class="tag tag-green">Success</span>
  </div>
</div>

<div class="section">
  <div class="lbl">Beta Banner</div>
  <div class="banner">
    <span class="tag tag-cream">Beta</span>
    <span>Unreleased firmware. For internal testing only.</span>
  </div>
</div>

<div class="section">
  <div class="lbl">Success Message</div>
  <div class="success-msg">Firmware updated successfully.</div>
</div>

<div class="section">
  <div class="lbl">Warning Box</div>
  <div class="warning-box">
    <span style="background:#ef4444;color:#fff;font-weight:700;padding:1px 6px;font-size:12px">Note:</span>
    Your pedal may be damaged by uploading incorrect firmware.
  </div>
</div>

</body></html>
