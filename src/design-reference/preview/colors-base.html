<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; }
body { font-family: "Poppins", sans-serif; background: #fefbf6; padding: 20px; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.swatch { display: flex; flex-direction: column; gap: 6px; }
.chip { height: 64px; border: 1.5px solid rgba(0,0,0,0.12); }
.chip--dark { border-color: rgba(255,255,255,0.1); }
.name { font-size: 11px; font-weight: 700; color: #000; }
.hex  { font-size: 10px; color: #7c746a; }
</style></head><body>
<div class="grid">
  <div class="swatch"><div class="chip" style="background:#fefbf6; border-color:#ddd"></div><div class="name">Cream</div><div class="hex">#fefbf6</div></div>
  <div class="swatch"><div class="chip" style="background:#000000"></div><div class="name">Black</div><div class="hex">#000000</div></div>
  <div class="swatch"><div class="chip" style="background:#ba8e51"></div><div class="name">Gold</div><div class="hex">#ba8e51</div></div>
  <div class="swatch"><div class="chip" style="background:#10b981"></div><div class="name">Green</div><div class="hex">#10b981</div></div>
  <div class="swatch"><div class="chip" style="background:#ef4444"></div><div class="name">Red</div><div class="hex">#ef4444</div></div>
</div>
</body></html>
