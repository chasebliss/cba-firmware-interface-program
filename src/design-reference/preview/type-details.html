<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; }
body { font-family: "Poppins", sans-serif; background: #fefbf6; padding: 20px 24px; -webkit-font-smoothing: antialiased; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cell { padding: 14px; border: 2px solid #000; background: #fefbf6; }
.label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #a89e93; margin-bottom: 8px; }
</style></head><body>
<div class="grid">
  <div class="cell">
    <div class="label">Weights</div>
    <div style="font-size:15px;font-weight:400">Regular 400 — Connect</div>
    <div style="font-size:15px;font-weight:500">Medium 500 — Connect</div>
    <div style="font-size:15px;font-weight:600">Semibold 600 — Connect</div>
    <div style="font-size:15px;font-weight:700">Bold 700 — Connect</div>
  </div>
  <div class="cell">
    <div class="label">Italic on Hover</div>
    <div style="font-size:15px;font-weight:700">Default button state</div>
    <div style="font-size:15px;font-weight:700;font-style:italic">Hovered button state</div>
    <div style="font-size:12px;color:#5a5248;margin-top:8px">Italic is a <em>state</em>, not decoration</div>
  </div>
  <div class="cell">
    <div class="label">Uppercase Tag</div>
    <div style="display:inline-block;background:#000;color:#fefbf6;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;padding:2px 8px">Beta</div>
    &nbsp;
    <div style="display:inline-block;background:#ef4444;color:#fff;font-size:11px;font-weight:700;padding:2px 8px">Note</div>
  </div>
  <div class="cell">
    <div class="label">Bordered Heading (h1 pattern)</div>
    <div style="border:2px solid #000;padding:12px 16px;font-weight:700;font-size:18px;width:fit-content">Bliss Programmer.</div>
  </div>
</div>
</body></html>
