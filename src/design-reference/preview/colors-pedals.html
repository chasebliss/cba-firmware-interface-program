<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; }
body { font-family: "Poppins", sans-serif; background: #fefbf6; padding: 20px; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.swatch { display: flex; flex-direction: column; gap: 6px; }
.chip { height: 64px; border: 1.5px solid rgba(0,0,0,0.08); }
.name { font-size: 11px; font-weight: 700; color: #000; }
.hex  { font-size: 10px; color: #7c746a; }
.sub  { font-size: 9px; color: #a89e93; text-transform: uppercase; letter-spacing: 0.08em; }
</style></head><body>
<div class="grid">
  <div class="swatch"><div class="chip" style="background:#b48ecf"></div><div class="name">MOOD Lav.</div><div class="hex">#b48ecf</div></div>
  <div class="swatch"><div class="chip" style="background:#c9aad8"></div><div class="name">MOOD Light</div><div class="hex">#c9aad8</div></div>
  <div class="swatch"><div class="chip" style="background:#e87fa0"></div><div class="name">Lossy Pink</div><div class="hex">#e87fa0</div></div>
  <div class="swatch"><div class="chip" style="background:#f4b8cb"></div><div class="name">Lossy Light</div><div class="hex">#f4b8cb</div></div>
  <div class="swatch"><div class="chip" style="background:#c0392b"></div><div class="name">HW Red</div><div class="hex">#c0392b</div></div>
</div>
</body></html>
