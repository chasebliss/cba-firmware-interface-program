<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; }
body { font-family: "Poppins", sans-serif; background: #fefbf6; padding: 24px; -webkit-font-smoothing: antialiased; }
.lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #a89e93; margin-bottom: 10px; }
.col { display: flex; flex-direction: column; gap: 20px; }
.acc-trigger { width: 384px; border: 2px solid #000; background: #fefbf6; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; cursor: pointer; }
.acc-trigger.hovered { box-shadow: 0 20px 25px -5px rgb(0 0 0/.1), 0 8px 10px -6px rgb(0 0 0/.1); }
.acc-body { width: 384px; border: 2px solid #000; border-top: none; background: #fefbf6; }
.acc-item { padding: 12px 16px; border-bottom: 1px solid #000; font-weight: 700; }
.acc-item:last-child { border-bottom: none; }
.chevron { transition: transform 0.15s ease; }
.chevron.open { transform: rotate(180deg); }
</style></head><body>
<div class="col">
  <div>
    <div class="lbl">Idle</div>
    <div class="acc-trigger" style="border-color:#ccc;box-shadow:none">
      Select Pedal...
      <svg class="chevron" viewBox="0 0 20 20" width="24" height="24"><path d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-4.293-1.707a1 1 0 00-1.414 0L10 10.586 7.707 8.293a1 1 0 00-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 000-1.414z" fill="#ba8e51"/></svg>
    </div>
  </div>
  <div>
    <div class="lbl">Hover</div>
    <div class="acc-trigger hovered">
      Select Pedal...
      <svg class="chevron" viewBox="0 0 20 20" width="24" height="24"><path d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-4.293-1.707a1 1 0 00-1.414 0L10 10.586 7.707 8.293a1 1 0 00-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 000-1.414z" fill="#ba8e51"/></svg>
    </div>
  </div>
  <div>
    <div class="lbl">Open</div>
    <div class="acc-trigger hovered">
      MOOD MKII
      <svg class="chevron open" viewBox="0 0 20 20" width="24" height="24"><path d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-4.293-1.707a1 1 0 00-1.414 0L10 10.586 7.707 8.293a1 1 0 00-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 000-1.414z" fill="#ba8e51"/></svg>
    </div>
    <div class="acc-body">
      <div class="acc-item">MOOD MKII</div>
      <div class="acc-item" style="background:#e87fa0">Lossy</div>
      <div class="acc-item">Blooper</div>
    </div>
  </div>
</div>
</body></html>
