<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; }
body { font-family: "Poppins", sans-serif; background: #fefbf6; padding: 24px; -webkit-font-smoothing: antialiased; }
.lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #a89e93; margin-bottom: 8px; }
.section { margin-bottom: 20px; }

.dropdown-trigger {
  width: 384px; padding: 12px 14px;
  border: 2px solid #000; background: #fefbf6;
  display: flex; justify-content: space-between; align-items: center;
  font-weight: 700; cursor: pointer;
  box-shadow: 0 20px 25px -5px rgb(0 0 0/.1), 0 8px 10px -6px rgb(0 0 0/.1);
}
.dropdown-list {
  width: 384px;
  border: 2px solid #000; border-top: none;
  background: #fefbf6;
}
.dropdown-item {
  padding: 12px 16px;
  border-bottom: 1px solid #000;
  font-weight: 700; cursor: pointer;
}
.dropdown-item:last-child { border-bottom: none; }
.dropdown-item.hovered { background: #b48ecf; }
.dropdown-item.hovered2 { background: #e87fa0; }
</style></head><body>

<div class="section">
  <div class="lbl">Closed State</div>
  <div class="dropdown-trigger" style="box-shadow:none;border-color:#ccc">
    Select Pedal...
    <svg viewBox="0 0 20 20" width="24" height="24"><path d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-4.293-1.707a1 1 0 00-1.414 0L10 10.586 7.707 8.293a1 1 0 00-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 000-1.414z" fill="#ba8e51"/></svg>
  </div>
</div>

<div class="section">
  <div class="lbl">Open — with hover on item</div>
  <div class="dropdown-trigger">
    MOOD MKII
    <svg viewBox="0 0 20 20" width="24" height="24"><path d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-4.293-1.707a1 1 0 00-1.414 0L10 10.586 7.707 8.293a1 1 0 00-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 000-1.414z" fill="#ba8e51"/></svg>
  </div>
  <div class="dropdown-list">
    <div class="dropdown-item hovered">MOOD MKII</div>
    <div class="dropdown-item hovered2">Lossy</div>
    <div class="dropdown-item">Blooper</div>
    <div class="dropdown-item">Thermae</div>
  </div>
</div>

</body></html>
