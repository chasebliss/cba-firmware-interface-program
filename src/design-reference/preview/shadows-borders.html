<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; }
body { font-family: "Poppins", sans-serif; background: #fefbf6; padding: 24px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; align-items: end; }
.item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.box { width: 80px; height: 50px; background: #fefbf6; border: 2px solid #000; }
.lbl { font-size: 10px; font-weight: 700; text-align: center; color: #000; }
.sub { font-size: 9px; color: #a89e93; text-align: center; }
.divider { height: 40px; border-right: 2px solid #000; width: 1px; margin: 0 auto; }
</style></head><body>
<div class="grid">
  <div class="item">
    <div class="box" style="box-shadow:none;border-color:#ccc"></div>
    <div class="lbl">No Shadow</div><div class="sub">Default / idle state</div>
  </div>
  <div class="item">
    <div class="box" style="box-shadow:0 10px 15px -3px rgb(0 0 0/.1),0 4px 6px -2px rgb(0 0 0/.05)"></div>
    <div class="lbl">--shadow-md</div><div class="sub">Accordion hover</div>
  </div>
  <div class="item">
    <div class="box" style="box-shadow:0 20px 25px -5px rgb(0 0 0/.1),0 8px 10px -6px rgb(0 0 0/.1)"></div>
    <div class="lbl">--shadow-lg</div><div class="sub">Active button</div>
  </div>
  <div class="item">
    <div class="box" style="box-shadow:0 25px 50px -12px rgb(0 0 0/.18)"></div>
    <div class="lbl">--shadow-xl</div><div class="sub">Instruction overlay</div>
  </div>
</div>
<div style="margin-top:20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap">
  <div style="display:flex;align-items:center;gap:8px"><div style="width:40px;height:24px;border:2px solid #000;background:#fefbf6"></div><span style="font-size:11px;font-weight:700">2px black — default</span></div>
  <div style="display:flex;align-items:center;gap:8px"><div style="width:40px;height:24px;border:1px solid #000;background:#fefbf6"></div><span style="font-size:11px;font-weight:700">1px black — panel</span></div>
  <div style="display:flex;align-items:center;gap:8px"><div style="width:40px;height:24px;border:2px solid #10b981;background:#fefbf6"></div><span style="font-size:11px;font-weight:700">2px green — success</span></div>
  <div style="display:flex;align-items:center;gap:8px"><div style="width:24px;height:24px;background:#000;border-radius:0"></div><span style="font-size:11px;font-weight:700">radius: 0 — always</span></div>
</div>
</body></html>
