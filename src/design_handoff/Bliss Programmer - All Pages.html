/* ─── Flash hook ─────────────────────────── */
function useFlash(){
  const [sel,setSel]=useState(null);
  const [conn,setConn]=useState(false);
  const [prog,setProg]=useState(0);
  const [going,setGoing]=useState(false);
  const [done,setDone]=useState(false);
  function pick(fw){setSel(fw);setConn(false);setProg(0);setGoing(false);setDone(false);}
  function connect(){setConn(true);}
  function update(){
    setGoing(true);setDone(false);setProg(0);
    const iv=setInterval(()=>setProg(p=>{
      if(p>=100){clearInterval(iv);setGoing(false);setDone(true);return 100;}
      return p+1.2;
    }),70);
  }
  function reset(){setSel(null);setConn(false);setProg(0);setGoing(false);setDone(false);}
  return{sel,conn,prog,going,done,pick,connect,update,reset};
}

function Logo({w=140}){
  return <img src="assets/logo.svg" alt="Chase Bliss Audio"
    style={{width:w,height:w*307/2315,display:'block'}}/>;
}

/* ─── BackLink ───────────────────────────── */
function BackLink({label='To main site',color=INK,onClick}){
  const [h,setH]=useState(false);
  return(
    <a href="#" onClick={e=>{e.preventDefault();onClick&&onClick();}}
      onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)}
      style={{display:'flex',alignItems:'center',gap:5,textDecoration:'none',
              color,fontWeight:700,fontSize:11,textTransform:'uppercase',letterSpacing:'0.1em'}}>
      <svg width="16" height="16" fill="none" stroke={color} viewBox="0 0 24 24"
        style={{transform:h?'translateX(-3px)':'none',transition:'transform .2s',flexShrink:0}}>
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M15 19l-7-7 7-7"/>
      </svg>
      {label}
    </a>
  );
}

/* ─── Dropdown ───────────────────────────── */
function DD({sel,onSel,width='100%',placeholder='Select firmware…',items=FWS}){
  const [open,setOpen]=useState(false);
  const [hov,setHov]=useState(null);
  const ref=useRef(null);
  useEffect(()=>{
    function h(e){if(ref.current&&!ref.current.contains(e.target))setOpen(false);}
    document.addEventListener('mousedown',h);return()=>document.removeEventListener('mousedown',h);
  },[]);
  return(

/* ─── Button ─────────────────────────────── */
function Btn({children,disabled,success,danger,onClick,width=200,small=false}){
  const [h,setH]=useState(false);
  const bdr=danger?RED:success?GREEN:INK;
  const clr=danger?RED:success?GREEN:INK;
  return(
    <button disabled={disabled} onClick={onClick}
      onMouseEnter={()=>!disabled&&setH(true)} onMouseLeave={()=>setH(false)}
      style={{
        fontFamily:'Poppins,sans-serif',fontWeight:700,fontSize:small?11:13,
        letterSpacing:small?'0.07em':'0.02em',
        background:CR,border:`2px solid ${bdr}`,color:clr,
        width,height:small?36:48,padding:'0 16px',
        cursor:disabled?'not-allowed':'pointer',opacity:disabled?.28:1,
        fontStyle:h&&!disabled?'italic':'normal',
        boxShadow:h&&!disabled?'0 8px 20px rgba(0,0,0,.11)':'none',
        transition:'box-shadow .2s,font-style .05s,opacity .2s',
        display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,
      }}>
      {children}
    </button>
  );
}

/* ─── Progress ───────────────────────────── */
function Prog({value,color,height=5}){
  const id='p'+(color||'').replace(/[^a-z0-9]/gi,'x');
  return(
    <div style={{width:'100%'}}>
      <style>{`#${id}::-webkit-progress-value{background:${color};}`}</style>
      <progress id={id} value={value} max={100} style={{width:'100%',height}}/>
    </div>
  );
}

            {(F.going||F.done)&&(
              <div style={{padding:'14px 20px',display:'flex',flexDirection:'column',gap:10}}>
                <Prog value={F.prog} color={F.sel?.bgColor||GREEN}/>
                <div style={{fontSize:13,fontWeight:700,color:GREEN,
                             animation:F.going?'pulse 1.8s ease infinite':'none'}}>
                  {F.done?'Update complete.':`Uploading… ${Math.round(F.prog)}%`}
                </div>
                {F.done&&<Btn onClick={F.reset} width={180}>Flash again</Btn>}
              </div>
            )}
          </div>
        </div>

        {/* Divider */}
        <div style={{background:'rgba(0,0,0,.09)',alignSelf:'stretch'}}/>

        {/* Right: instructions */}
        <div style={{padding:'44px 0 80px 36px',position:'sticky',top:24}}>
          <SLabel>Instructions</SLabel>
          <OSTabs os={os} setOs={setOs}/>
          <Instr os={os}/>
        </div>
      </div>
    </div>
  );
}


/*══════════════════════════════════════════════════════
  PAGE: ADMIN  /admin
  Local file flasher + catalogue manager.
  Two-column: flash tool left, catalogue right.
══════════════════════════════════════════════════════*/
function PageAdmin({goTo}){
  // Flash state
  const [file,setFile]=useState(null);
  const [conn,setConn]=useState(false);
  const [prog,setProg]=useState(0);
  const [going,setGoing]=useState(false);
  const [done,setDone]=useState(false);
  function connect(){setConn(true);}
  function update(){
    setGoing(true);setDone(false);setProg(0);
    const iv=setInterval(()=>setProg(p=>{
      if(p>=100){clearInterval(iv);setGoing(false);setDone(true);return 100;}
      return p+1.4;
    }),70);
  }
  function flashReset(){setFile(null);setConn(false);setProg(0);setGoing(false);setDone(false);}

  // Save form state
  const [saveName,setSaveName]=useState('');
  const [saveDesc,setSaveDesc]=useState('');
  const [saveColor,setSaveColor]=useState('#ba8e51');
  const [saveTarget,setSaveTarget]=useState('beta');
  const [saving,setSaving]=useState(false);
  const [saveMsg,setSaveMsg]=useState(null);
  const [saveOk,setSaveOk]=useState(false);

  function handleSave(){
    if(!file||!saveName.trim())return;
    setSaving(true);setSaveMsg(null);
    setTimeout(()=>{
      setSaving(false);setSaveOk(true);
      setSaveMsg(`Committed to ${saveTarget}. Visible after next deploy.`);
    },1800);
  }

  // Catalogue state
  const [catalogue,setCatalogue]=useState(ADMIN_FWS);
  const [deleting,setDeleting]=useState(null);
  function handleDelete(entry){
    const key=`${entry.target}:${entry.filename}`;
    setDeleting(key);
    setTimeout(()=>{
      setCatalogue(c=>c.filter(e=>!(e.target===entry.target&&e.filename===entry.filename)));
      setDeleting(null);
    },700);
  }

  const canConnect=!!file&&!conn&&!going;
  const canUpdate=conn&&!!file&&!going;
  const canSave=!!file&&saveName.trim().length>0&&!saving&&!going;

  // Field style
  const fieldStyle={
    border:`2px solid ${INK}`,background:CR,padding:'9px 12px',
    fontFamily:'Poppins,sans-serif',fontWeight:700,fontSize:13,
    width:'100%',outline:'none',
  };
  const labelStyle={fontSize:10,fontWeight:700,textTransform:'uppercase',
                    letterSpacing:'0.1em',color:'rgba(0,0,0,0.38)',
                    display:'block',marginBottom:6};

  return(
    <div style={{minHeight:'100vh',background:'#f5f2ec',fontFamily:'Poppins,sans-serif',animation:'fadeIn .4s ease-out'}}>

      {/* Admin header stripe */}
      <div style={{background:INK,padding:'0 7vw'}}>
        <div style={{maxWidth:1200,margin:'0 auto',padding:'12px 0',
                     display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <img src="assets/logo.svg" alt="Chase Bliss Audio"
              style={{width:100,height:100*307/2315,display:'block',filter:'invert(1)',opacity:0.7}}/>
            <span style={{width:1,height:16,background:'rgba(255,255,255,.2)',display:'block'}}/>
            <span style={{fontSize:11,fontWeight:700,textTransform:'uppercase',
                          letterSpacing:'0.14em',color:'rgba(255,255,255,0.5)',
                          fontFamily:'JetBrains Mono,monospace'}}>
              Admin
            </span>
          </div>
          <BackLink color='rgba(254,251,246,0.45)' label="Exit admin" onClick={()=>goTo('home')}/>
        </div>
      </div>

      {/* Page header */}
      <div style={{background:CR,borderBottom:`2px solid ${INK}`,padding:'0 7vw'}}>
        <div style={{maxWidth:1200,margin:'0 auto',padding:'22px 0',
                     display:'flex',alignItems:'flex-end',justifyContent:'space-between'}}>
          <div>
            <p style={{fontSize:10,fontWeight:700,textTransform:'uppercase',
                       letterSpacing:'0.12em',color:'rgba(0,0,0,0.35)',marginBottom:6}}>
              firmware.chasebliss.com
            </p>
            <h1 style={{fontSize:'clamp(1.4rem,2vw,1.9rem)',fontWeight:700,letterSpacing:'-0.02em'}}>
              Admin Flasher.
            </h1>
          </div>
          <BinaryHero width={200} opacity={0.18} flashing={going}/>
        </div>
      </div>

      {/* Two-column body */}
      <div style={{padding:'0 7vw',maxWidth:1200,margin:'0 auto',
                   display:'grid',gridTemplateColumns:'1fr 1px 400px',
                   minHeight:'calc(100vh - 130px)',alignItems:'start'}}>

        {/* Left: flash tool */}
        <div style={{padding:'36px 48px 80px 0',display:'flex',flexDirection:'column',gap:0}}>

          {/* Section: Load file */}
          <div style={{paddingBottom:28,borderBottom:`1px solid rgba(0,0,0,.1)`,marginBottom:28}}>
            <SLabel>1. Load firmware file</SLabel>
            <label style={{
              display:'flex',alignItems:'center',justifyContent:'center',
              border:`2px dashed ${file?INK:'rgba(0,0,0,0.2)'}`,
              background:file?`rgba(186,142,81,0.06)`:CR,
              padding:'20px 24px',cursor:'pointer',
              fontWeight:700,fontSize:13,
              transition:'border-color .2s,background .2s',
              gap:10,
            }}>
              <svg width="18" height="18" fill="none" stroke={file?GOLD:'rgba(0,0,0,0.3)'} viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2"
                  d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
              </svg>
              <span style={{color:file?INK:'rgba(0,0,0,0.4)',maxWidth:280,
                            overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                {file?file.name:'Choose .bin or .hex file'}
              </span>
              <input type="file" accept=".bin,.hex" style={{display:'none'}}
                onChange={e=>setFile(e.target.files?.[0]||null)}/>
            </label>
            {file&&(
              <div style={{marginTop:10,display:'flex',alignItems:'center',gap:10}}>
                <div style={{flex:1,padding:'8px 12px',border:'1px solid rgba(0,0,0,.1)',
                             background:'rgba(0,0,0,.02)',fontFamily:'JetBrains Mono,monospace',
                             fontSize:11,color:'rgba(0,0,0,0.5)'}}>
                  {file.name} · {(file.size/1024).toFixed(1)} KB
                </div>
                <button onClick={()=>{setFile(null);flashReset();}} style={{
                  all:'unset',cursor:'pointer',fontWeight:700,fontSize:11,
                  color:'rgba(0,0,0,0.35)',textDecoration:'underline',textUnderlineOffset:3,
                  whiteSpace:'nowrap',
                }}>Remove</button>
              </div>
            )}
          </div>

          {/* Section: Connect & Flash */}
          <div style={{paddingBottom:28,borderBottom:`1px solid rgba(0,0,0,.1)`,marginBottom:28,
                       opacity:file?1:.4,transition:'opacity .3s'}}>
            <SLabel>2. Connect &amp; flash</SLabel>
            {!going&&!done?(<>
              <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
                <Btn disabled={!canConnect} onClick={connect} width={170}>
                  {conn?'Connected ✓':'Connect'}
                </Btn>
                <Btn disabled={!canUpdate} success={canUpdate} onClick={update} width={170}>Update</Btn>
              </div>
              {conn&&<p style={{marginTop:10,fontSize:11,color:GREEN,fontWeight:700}}>Device connected — ready to update.</p>}
            </>):(
              <div style={{display:'flex',flexDirection:'column',gap:10,maxWidth:360}}>
                <Prog value={prog} color={GOLD}/>
                <div style={{fontSize:13,fontWeight:700,color:GREEN,
                             animation:going?'pulse 1.8s ease infinite':'none'}}>
                  {done?'Flash complete.':`Uploading… ${Math.round(prog)}%`}
                </div>
                {done&&<Btn onClick={flashReset} width={160} small>Flash again</Btn>}
              </div>
            )}
          </div>

          {/* Section: Save to repo */}
          <div style={{opacity:file?1:.4,transition:'opacity .3s'}}>
            <SLabel>3. Save to repo <span style={{color:'rgba(0,0,0,.3)',fontWeight:500,textTransform:'none',letterSpacing:0}}>(optional)</span></SLabel>
            <div style={{display:'flex',flexDirection:'column',gap:14,maxWidth:360}}>
              <div>
                <label style={labelStyle}>Name</label>
                <input type="text" value={saveName} onChange={e=>setSaveName(e.target.value)}
                  placeholder="e.g. MOOD MKII v1.2" style={fieldStyle}/>
              </div>
              <div>
                <label style={labelStyle}>Description <span style={{fontWeight:400,textTransform:'none',letterSpacing:0}}>(optional)</span></label>
                <input type="text" value={saveDesc} onChange={e=>setSaveDesc(e.target.value)}
                  placeholder="Brief changelog" style={fieldStyle}/>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:16}}>
                <div style={{flex:1}}>
                  <label style={labelStyle}>Accent color</label>
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <input type="color" value={saveColor} onChange={e=>setSaveColor(e.target.value)}
                      style={{width:40,height:36,border:`2px solid ${INK}`,padding:2,
                               cursor:'pointer',background:CR}}/>
                    <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:11,fontWeight:700,
                                  color:'rgba(0,0,0,0.5)'}}>{saveColor}</span>
                    <div style={{width:20,height:20,background:saveColor,border:`1px solid rgba(0,0,0,.15)`}}/>
                  </div>
                </div>
                <div>
                  <label style={labelStyle}>Target</label>
                  <div style={{display:'flex',gap:16}}>
                    {['beta','production'].map(t=>(
                      <label key={t} style={{display:'flex',alignItems:'center',gap:6,
                                             cursor:'pointer',fontWeight:700,fontSize:12}}>
                        <input type="radio" name="saveTarget" value={t}
                          checked={saveTarget===t} onChange={()=>setSaveTarget(t)}
                          style={{accentColor:INK}}/>
                        {t.charAt(0).toUpperCase()+t.slice(1)}
                      </label>
                    ))}
                  </div>
                </div>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:16}}>
                <Btn disabled={!canSave} onClick={handleSave} width={180}>
                  {saving?'Saving…':'Save to repo'}
                </Btn>
                {saveMsg&&(
                  <p style={{fontSize:12,fontWeight:700,
                             color:saveOk?GREEN:RED,maxWidth:200,lineHeight:1.4}}>
                    {saveMsg}
                  </p>
                )}
              </div>
            </div>
          </div>
        </div>

        {/* Divider */}
        <div style={{background:'rgba(0,0,0,.09)',alignSelf:'stretch'}}/>

        {/* Right: catalogue */}
        <div style={{padding:'36px 0 80px 36px'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
            <SLabel style={{marginBottom:0}}>In-repo firmwares</SLabel>
            <button onClick={()=>setCatalogue(ADMIN_FWS)} style={{
              all:'unset',cursor:'pointer',fontFamily:'Poppins,sans-serif',
              fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.1em',
              color:'rgba(0,0,0,0.35)',textDecoration:'underline',textUnderlineOffset:3,
            }}>
              Refresh
            </button>
          </div>

          {/* Target filter pills */}
          <div style={{display:'flex',gap:8,marginBottom:16}}>
            {[
              {label:'All',count:catalogue.length,color:'rgba(0,0,0,0.3)'},
              {label:'Production',count:catalogue.filter(f=>f.target==='production').length,color:GREEN},
              {label:'Beta',count:catalogue.filter(f=>f.target==='beta').length,color:GOLD},
            ].map(p=>(
              <div key={p.label} style={{display:'flex',alignItems:'center',gap:5,
                                         padding:'4px 10px',border:'1px solid rgba(0,0,0,.12)',
                                         background:CR}}>
                <span style={{fontSize:10,fontWeight:700,textTransform:'uppercase',
                               letterSpacing:'0.08em',color:p.color}}>{p.label}</span>
                <span style={{fontSize:10,fontWeight:700,color:'rgba(0,0,0,0.35)'}}>{p.count}</span>
              </div>
            ))}
          </div>

          {/* Table */}
          <div style={{border:`2px solid ${INK}`,background:CR}}>
            {/* Header */}
            <div style={{
              display:'grid',gridTemplateColumns:'80px 1fr 1fr auto',
              padding:'8px 14px',borderBottom:`2px solid ${INK}`,
              background:'rgba(0,0,0,0.03)',
            }}>
              {['Target','Name','File',''].map((h,i)=>(
                <span key={i} style={{fontSize:9,fontWeight:700,textTransform:'uppercase',
                                       letterSpacing:'0.12em',color:'rgba(0,0,0,0.35)'}}>
                  {h}
                </span>
              ))}
            </div>
            {catalogue.length===0&&(
              <div style={{padding:'24px',textAlign:'center',fontSize:13,color:'rgba(0,0,0,0.35)'}}>
                Nothing uploaded yet.
              </div>
            )}
            {catalogue.map((fw,i)=>{
              const key=`${fw.target}:${fw.filename}`;
              const busy=deleting===key;
              const isBeta=fw.target==='beta';
              return(
                <div key={key} style={{
                  display:'grid',gridTemplateColumns:'80px 1fr 1fr auto',
                  padding:'12px 14px',alignItems:'center',
                  borderBottom:i<catalogue.length-1?'1px solid rgba(0,0,0,.07)':'none',
                  opacity:busy?.4:1,transition:'opacity .2s',
                  background:busy?'rgba(0,0,0,.02)':undefined,
                }}>
                  <span style={{
                    fontSize:9,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.1em',
                    color:isBeta?GOLD:GREEN,padding:'3px 0',
                  }}>
                    {fw.target}
                  </span>
                  <span style={{fontWeight:700,fontSize:13,paddingRight:12}}>{fw.name}</span>
                  <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:11,
                                 color:'rgba(0,0,0,0.45)',paddingRight:12,
                                 overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                    {fw.filename}
                  </span>
                  <button onClick={()=>handleDelete(fw)} disabled={busy} style={{
                    all:'unset',cursor:busy?'not-allowed':'pointer',
                    padding:'4px 10px',border:`1px solid ${RED}`,
                    fontFamily:'Poppins,sans-serif',fontSize:10,fontWeight:700,
                    color:RED,letterSpacing:'0.06em',textTransform:'uppercase',
                    opacity:busy?.5:1,transition:'background .15s,color .15s',
                  }}
                  onMouseEnter={e=>{if(!busy){e.currentTarget.style.background=RED;e.currentTarget.style.color=CR;}}}
                  onMouseLeave={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.color=RED;}}>
                    {busy?'…':'Delete'}
                  </button>
                </div>
              );
            })}
          </div>

          {/* Hint */}
          <p style={{marginTop:14,fontSize:11,color:'rgba(0,0,0,0.3)',lineHeight:1.6}}>
            Changes committed via Save to repo are visible after the next Vercel deploy.
          </p>
        </div>
      </div>
    </div>
  );
}


/*══════════════════════════════════════════════════════
  ROUTER
══════════════════════════════════════════════════════*/
const ROUTES=[
  {id:'home',  label:'/ Home'},
  {id:'beta',  label:'/beta'},
  {id:'admin', label:'/admin'},
];

function App(){
  const [page,setPage]=useState(()=>localStorage.getItem('cba-page')||'home');
  function goTo(p){setPage(p);localStorage.setItem('cba-page',p);}

  const Page=page==='home'?PageHome:page==='beta'?PageBeta:PageAdmin;

  return(
    <div>
      <Page goTo={goTo}/>

      {/* Route switcher */}
      <div style={{
        position:'fixed',bottom:24,left:'50%',transform:'translateX(-50%)',
        background:INK,display:'flex',zIndex:9000,
        boxShadow:'0 6px 24px rgba(0,0,0,.4)',border:'2px solid #222',
        fontFamily:'Poppins,sans-serif',
      }}>
        {ROUTES.map((r,i)=>(
          <button key={r.id} onClick={()=>goTo(r.id)} style={{
            all:'unset',cursor:'pointer',
            fontFamily:'JetBrains Mono,monospace',fontWeight:700,fontSize:11,
            letterSpacing:'0.08em',padding:'12px 22px',whiteSpace:'nowrap',
            background:page===r.id?CR:INK,
            color:page===r.id?INK:'rgba(254,251,246,0.4)',
            borderRight:i<ROUTES.length-1?'1px solid #333':'none',
            transition:'background .15s,color .15s',
          }}>
            {r.label}
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
